services:
  web:
    build: ./web
    image: hslu-ot-ctf/web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8100}:3000"
    environment:
      FLAG: "${FLAG}"
      ADMIN_USER: "${ADMIN_USER:-ot.supervisor}"
      # Blank -> randomised per deployment and handed to the bot via the shared
      # volume below. Set ADMIN_PASSWORD in .env to pin it for development.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      BOT_TOKEN: "${BOT_TOKEN:-4f1c0a9d2b8e47d6}"
      MAX_LABEL_LENGTH: "${MAX_LABEL_LENGTH:--1}"
      REVIEW_COOLDOWN_SECONDS: "${REVIEW_COOLDOWN_SECONDS:-15}"
      SESSION_TTL_MINUTES: "${SESSION_TTL_MINUTES:-30}"
      COLLECTOR_HINT: "http://collector:8080"
      COLLECTOR_PUBLIC: "http://localhost:${COLLECTOR_PORT:-8200}"
      STAGE2_ENABLED: "${STAGE2_ENABLED:-true}"
      SCADA_URL: "http://localhost:${SCADA_PORT:-8300}"
      SCADA_INTERNAL_URL: "http://scada-gate:8080"
    volumes:
      - gridops_secret:/handshake

  scada:
    build: ./scada
    image: hslu-ot-ctf/scada
    restart: unless-stopped
    # No host port: the dispatch console is reachable only through scada-gate,
    # which requires a supervisor session. FUXA's operator account is the stock
    # default baked into the image; the challenge does not need it.
    expose:
      - "1881"
    environment:
      FLAG2: "${FLAG2}"

  scada-gate:
    build: ./scada-gate
    image: hslu-ot-ctf/scada-gate
    restart: unless-stopped
    depends_on:
      - web
      - scada
    ports:
      - "${SCADA_PORT:-8300}:8080"
    environment:
      SCADA_TARGET: "http://scada:1881"
      PORTAL_URL: "http://web:3000"
      PORTAL_PUBLIC_URL: "http://localhost:${WEB_PORT:-8100}"

  bot:
    build: ./bot
    image: hslu-ot-ctf/bot
    restart: unless-stopped
    depends_on:
      - web
    # Public resolver so the supervisor bot can reach a student-chosen
    # out-of-band host (e.g. an interactsh / *.oast.fun collaborator). The lab's
    # default resolver returns NXDOMAIN for those. The bundled collector
    # (http://collector:8080) works without this, on the internal Docker network.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      WEB_URL: "http://web:3000"
      BOT_TOKEN: "${BOT_TOKEN:-4f1c0a9d2b8e47d6}"
      ADMIN_USER: "${ADMIN_USER:-ot.supervisor}"
      # No ADMIN_PASSWORD: read from the shared volume the portal writes (or set
      # it in .env to pin it for development).
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PAGE_DWELL_MS: "${PAGE_DWELL_MS:-6000}"
    volumes:
      - gridops_secret:/handshake:ro

  collector:
    build: ./collector
    image: hslu-ot-ctf/collector
    restart: unless-stopped
    ports:
      - "${COLLECTOR_PORT:-8200}:8080"
    networks:
      default:
        # Short alias so a length-constrained payload (MAX_LABEL_LENGTH=50)
        # still fits: http://c:8080/
        aliases:
          - c

volumes:
  # Private channel for the randomised supervisor password (portal -> bot).
  gridops_secret:
